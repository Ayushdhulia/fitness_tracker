<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Elite Entry</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Abstract Background Glows */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }
        .glow-1 { top: -200px; left: -200px; }
        .glow-2 { bottom: -200px; right: -200px; }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 4rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: #1d4ed8;
            margin: 0 auto 2rem;
            border-radius: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(29, 78, 216, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 40px rgba(29, 78, 216, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(29, 78, 216, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 40px rgba(29, 78, 216, 0.5); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        p {
            color: #94a3b8;
            font-size: 1.2rem;
            margin: 1rem 0 3rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn {
            background: white;
            color: black;
            padding: 1.5rem 3rem;
            border-radius: 1.5rem;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.5rem;
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-10px) scale(1.05);
            background: #1d4ed8;
            color: white;
            box-shadow: 0 30px 60px rgba(29, 78, 216, 0.4);
        }

        .status {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #4ade80;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">
        <div class="logo-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        </div>
        <h1>FITTRACK</h1>
        <p>Elite Performance Suite</p>
        
        <a href="http://localhost:5173" class="btn">Enter System</a>
        
        <div class="status">
            <div class="dot"></div>
            Systems Operational
        </div>
    </div>
</body>
</html>
